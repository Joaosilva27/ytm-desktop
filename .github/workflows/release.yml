name: Release

# Builds a universal macOS app, packages it as a drag-to-install disk image and
# publishes it on the releases page.
#
# It runs on every push to main and publishes once per version: the version
# comes from CFBundleShortVersionString in Resources/Info.plist, and a version
# that already has a tag is skipped, so ordinary pushes cost a few seconds.
# Bump the version in Info.plist to cut a new release.
#
# Pushing a tag (git tag v1.1.0 && git push origin v1.1.0) or running this
# workflow by hand from the Actions tab always publishes.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 1.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    env:
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            PUBLISH=true
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v$VERSION"
            PUBLISH=true
          else
            VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)"
            TAG="v$VERSION"
            if git rev-parse --quiet --verify "refs/tags/$TAG" >/dev/null; then
              PUBLISH=false
            else
              PUBLISH=true
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PUBLISH=$PUBLISH" >> "$GITHUB_ENV"
          echo "Release $TAG — publish: $PUBLISH"

      - name: Already released
        if: env.PUBLISH != 'true'
        run: echo "$TAG already exists; nothing to publish."

      # Releases are ad-hoc signed and not notarized, so Gatekeeper asks for
      # confirmation on first launch. That is expected, not a build failure.
      - name: Build universal app
        if: env.PUBLISH == 'true'
        run: UNIVERSAL=1 VERSION="$VERSION" ./Tools/build.sh

      - name: Check the bundle
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          APP="dist/YouTube Music.app"
          lipo -info "$APP/Contents/MacOS/YouTube Music"
          lipo -archs "$APP/Contents/MacOS/YouTube Music" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/YouTube Music" | grep -q x86_64
          plutil -lint "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"

      - name: Package disk image
        if: env.PUBLISH == 'true'
        run: |
          set +e
          log="$RUNNER_TEMP/dmg.log"
          ./Tools/make-dmg.sh > "$log" 2>&1
          status=$?
          cat "$log"
          if [[ $status -ne 0 ]]; then
            {
              echo "### Disk image packaging failed (exit $status)"
              echo
              echo '```'
              tail -n 40 "$log"
              echo '```'
              echo
              echo "- macOS: $(sw_vers -productVersion) ($(uname -m))"
              echo "- image: $(hdiutil info | grep -c .) hdiutil lines"
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 "$log" | sed '/^$/d' | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi
          ls -lh dist/

      - name: Write release notes
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          mkdir -p build
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]


          def git(*args):
              result = subprocess.run(
                  ["git", *args], capture_output=True, text=True
              )
              return result.stdout.strip() if result.returncode == 0 else ""


          target = git("rev-parse", "--verify", "--quiet", tag) or git("rev-parse", "HEAD")
          previous = git("describe", "--tags", "--abbrev=0", target + "^")
          changes = git("log", "--no-merges", "--pretty=- %s", f"{previous}..{target}")
          if not changes.strip():
              changes = "- First public release."

          template = pathlib.Path(".github/release-notes.md").read_text()
          notes = (
              template.replace("__VERSION__", version)
              .replace("__TAG__", tag)
              .replace("__CHANGES__", changes)
          )
          pathlib.Path("build/release-notes.md").write_text(notes)
          print(notes)
          PY

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: YouTube-Music-DMG
          path: |
            dist/*.dmg
            dist/*.sha256

      - uses: softprops/action-gh-release@v2
        if: env.PUBLISH == 'true'
        with:
          tag_name: ${{ env.TAG }}
          name: YouTube Music ${{ env.VERSION }}
          body_path: build/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.sha256
